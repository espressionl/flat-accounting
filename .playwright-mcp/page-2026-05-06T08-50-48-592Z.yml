        - generic [ref=e134]:
          - generic [ref=e137]:
            - heading [level=3]
            - heading "De Nederlandsche Tafelronde staat voor:" [level=3] [ref=e138]
          - generic [ref=e140]:
            - generic [ref=e142]: 
            - heading "Vriendschap" [level=4] [ref=e144]
            - paragraph [ref=e146]: De Tafel verrijkt vriendschap en wederzijds begrip. Je ontwikkelt vriendschappen voor het leven. Op lokaal, nationaal en internationaal niveau. Waar je ook ter wereld komt, een Tafelaar is een vriend die je altijd zal helpen.
          - generic [ref=e148]:
            - generic [ref=e150]: 
            - heading "Zelfontplooiing" [level=4] [ref=e152]
            - paragraph [ref=e154]: Tafelavonden zijn vaak het platform van boeiende discussies. Je leert veel van Tafelaars met totaal andere beroepen, inzichten en persoonlijke ervaringen. Doordat vertrouwen het sleutelwoord van de Tafel is kun je al jouw uitdagingen en ervaringen delen om jezelf en mede Tafelaars sterker te maken.
          - generic [ref=e156]:
            - generic [ref=e158]: 
            - heading "Service" [level=4] [ref=e160]
            - paragraph [ref=e162]: Een Tafelaar is betrokken bij de lokale, nationale en internationale maatschappij. Je draagt je steentje bij door lokale en landelijke serviceprojecten actief en op eigen wijze te steunen. Daarbij neemt jouw Tafel een gezamenlijk initiatief en zorgt de landelijke Tafel ook altijd voor ondersteuning en initiatie van mooie service projecten.
          - generic [ref=e165]:
            - heading "Animatiefilm" [level=3] [ref=e166]
            - paragraph [ref=e167]: Regelmatig krijgen wij de vraag wat de Nederlandsche Tafelronde nou eigenlijk is en wat een lokale Tafelronde allemaal doet. En elke keer wanneer je het aan iemand vraagt kan het zijn dat er net een andere uitleg gegeven wordt. De één heeft het over zijn persoonlijke ontwikkeling, sommige vertellen over de avondjes in de kroeg en andere focussen hun uitleg vooral op de verschillende service projecten die ze doen. Maar het blijft lastig om een complete plaatje uit te leggen. Onze nieuwste animatiefilm legt het eenvoudig uit!
